<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>헌혈자 정보 및 전자문진 확인</title>
    <style>
        :root { --primary-color:#e63946; --bg-color:#f8f9fa; --card-bg:#fff; --border-color:#dee2e6; --text-color:#212529; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:'Noto Sans KR',sans-serif; background:var(--bg-color); color:var(--text-color); padding:20px; }
        .container { max-width:800px; margin:0 auto; background:var(--card-bg); border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.08); padding:24px; }
        h2 { font-size:1.4rem; color:var(--primary-color); border-bottom:2px solid var(--primary-color); padding-bottom:8px; margin-bottom:16px; }
        .section { margin-bottom:28px; }
        .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
        .form-group { display:flex; flex-direction:column; }
        .form-group label { font-size:.85rem; font-weight:600; margin-bottom:4px; color:#495057; }
        .form-group input,.form-group select { padding:8px 12px; border:1px solid var(--border-color); border-radius:6px; font-size:.95rem; }
        .questionnaire-table { width:100%; border-collapse:collapse; margin-top:8px; font-size:.9rem; }
        .questionnaire-table th,.questionnaire-table td { border:1px solid var(--border-color); padding:8px 12px; }
        .questionnaire-table th { background:#f1f3f5; font-weight:600; text-align:center; }
        .badge-pass { color:#2b8a3e; font-weight:bold; }
        .signature-container { border:2px dashed var(--border-color); border-radius:8px; background:#fafafa; }
        canvas { width:100%; height:150px; cursor:crosshair; touch-action:none; }
        .signature-actions { margin-top:8px; display:flex; justify-content:flex-end; }
        .btn { padding:8px 16px; border:0; border-radius:6px; font-weight:bold; cursor:pointer; }
        .btn-secondary { background:#ced4da; color:#333; }
        .btn-primary { background:var(--primary-color); color:#fff; }
        .submit-area { text-align:center; margin-top:20px; }
        .submit-area .btn { width:100%; max-width:300px; padding:12px; font-size:1rem; }
    </style>
</head>
<body>
<div class="container">
    <form id="donorCheckForm">
        <input type="hidden" id="confirmationId" th:value="${confirmation.confirmationId}">

        <div class="section">
            <h2>1. 헌혈자 정보 확인 및 변경</h2>
            <div class="grid-2" style="margin-bottom:12px;">
                <div class="form-group"><label for="donorName">성명</label><input id="donorName" type="text" th:value="${confirmation.name}" required></div>
                <div class="form-group"><label for="donorBirth">생년월일</label><input id="donorBirth" type="date" th:value="${confirmation.birthDate}" required></div>
            </div>
            <div class="grid-3" style="margin-bottom:12px;">
                <div class="form-group"><label for="height">신장 (cm)</label><input id="height" type="number" th:value="${confirmation.height}" step="0.1"></div>
                <div class="form-group"><label for="weight">체중 (kg)</label><input id="weight" type="number" th:value="${confirmation.weight}" step="0.1"></div>
                <div class="form-group"><label for="bloodType">혈액형</label>
                    <select id="bloodType">
                        <option value="A" th:selected="${confirmation.bloodType == 'A'}">A형</option>
                        <option value="B" th:selected="${confirmation.bloodType == 'B'}">B형</option>
                        <option value="O" th:selected="${confirmation.bloodType == 'O'}">O형</option>
                        <option value="AB" th:selected="${confirmation.bloodType == 'AB'}">AB형</option>
                    </select>
                </div>
            </div>
            <div class="grid-2" style="margin-bottom:12px;">
                <div class="form-group"><label for="phone">연락처</label><input id="phone" type="tel" th:value="${confirmation.phone}"></div>
                <div class="form-group"><label for="email">이메일</label><input id="email" type="email" th:value="${confirmation.email}"></div>
            </div>
            <div class="form-group"><label for="address">주소</label><input id="address" type="text" th:value="${confirmation.address}"></div>
        </div>

        <div class="section">
            <h2>2. 작성한 전자 문진 사항</h2>
            <table class="questionnaire-table"><thead><tr><th>문진 항목</th><th style="width:80px;">응답</th></tr></thead><tbody>
                <tr><td>오늘 몸 상태가 헌혈하기에 양호합니까?</td><td><span class="badge-pass">예</span></td></tr>
                <tr><td>최근 3일 이내에 약물을 복용하거나 주사를 맞은 적이 있습니까?</td><td><span class="badge-pass">아니오</span></td></tr>
                <tr><td>최근 1개월 이내에 해외를 방문한 적이 있습니까?</td><td><span class="badge-pass">아니오</span></td></tr>
                <tr><td>최근 1년 이내에 문신, 피어싱, 사혈침 시술을 받은 적이 있습니까?</td><td><span class="badge-pass">아니오</span></td></tr>
            </tbody></table>
        </div>

        <div class="section">
            <h2>3. 헌혈자 서명</h2>
            <p style="font-size:.85rem;color:#6c757d;margin-bottom:8px;">상기 작성된 정보 및 전자 문진 내용이 사실과 다름없음을 확인하며, 헌혈 진행에 동의합니다.</p>
            <div class="signature-container"><canvas id="signatureCanvas"></canvas></div>
            <div class="signature-actions"><button type="button" class="btn btn-secondary" id="clearSignature">서명 초기화</button></div>
            <input type="hidden" id="signatureData">
        </div>

        <div class="submit-area"><button type="submit" class="btn btn-primary">정보 확인 및 DB 저장</button></div>
    </form>
</div>

<script>
const canvas=document.getElementById('signatureCanvas');
const ctx=canvas.getContext('2d');
const signatureInput=document.getElementById('signatureData');
let isDrawing=false;
function resizeCanvas(){const ratio=Math.max(window.devicePixelRatio||1,1);canvas.width=canvas.offsetWidth*ratio;canvas.height=canvas.offsetHeight*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.lineCap='round';}
window.addEventListener('resize',resizeCanvas);resizeCanvas();
function getPos(e){const r=canvas.getBoundingClientRect();const x=e.touches?e.touches[0].clientX:e.clientX;const y=e.touches?e.touches[0].clientY:e.clientY;return{x:x-r.left,y:y-r.top};}
function startDrawing(e){isDrawing=true;const p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);}
function draw(e){if(!isDrawing)return;const p=getPos(e);ctx.lineTo(p.x,p.y);ctx.stroke();}
function stopDrawing(){if(isDrawing){isDrawing=false;signatureInput.value=canvas.toDataURL('image/png');}}
canvas.addEventListener('mousedown',startDrawing);canvas.addEventListener('mousemove',draw);canvas.addEventListener('mouseup',stopDrawing);canvas.addEventListener('mouseleave',stopDrawing);
canvas.addEventListener('touchstart',e=>{e.preventDefault();startDrawing(e)});canvas.addEventListener('touchmove',e=>{e.preventDefault();draw(e)});canvas.addEventListener('touchend',stopDrawing);
document.getElementById('clearSignature').addEventListener('click',()=>{ctx.clearRect(0,0,canvas.width,canvas.height);signatureInput.value='';});
document.getElementById('donorCheckForm').addEventListener('submit',async e=>{e.preventDefault();if(!signatureInput.value){alert('서명을 완료해 주세요.');return;}const id=document.getElementById('confirmationId').value;const body={donorName:document.getElementById('donorName').value,donorBirth:document.getElementById('donorBirth').value,height:parseFloat(document.getElementById('height').value),weight:parseFloat(document.getElementById('weight').value),bloodType:document.getElementById('bloodType').value,phone:document.getElementById('phone').value,email:document.getElementById('email').value,address:document.getElementById('address').value,signatureData:signatureInput.value};try{const response=await fetch(`/medical/donor_check/${id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const result=await response.json();if(!response.ok)throw new Error(result.message||'저장에 실패했습니다.');alert(result.message||'DB 저장이 완료되었습니다.');}catch(error){console.error(error);alert(error.message||'서버 통신 중 오류가 발생했습니다.');}});
</script>
</body>
</html>
