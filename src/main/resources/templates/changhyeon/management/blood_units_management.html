<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>혈액 재고 현황 (blood_units)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body{font-family:'Pretendard',system-ui,-apple-system,sans-serif}</style>
</head>
<body class="bg-slate-50 text-slate-800">
<div class="max-w-7xl mx-auto p-6">
    <header class="flex justify-between items-center mb-8 border-b pb-4 border-slate-200">
        <div><p class="text-xs font-mono text-indigo-600 font-semibold tracking-wide uppercase">URL: /medical/blood_units_management</p><h1 class="text-2xl font-bold text-slate-900 mt-1">혈액 재고 관리 대시보드</h1></div>
        <div class="text-right"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">DB: blood_units</span><p class="text-xs text-slate-400 mt-1" id="last-updated">최신화: 불러오는 중...</p></div>
    </header>

    <div id="data-source-alert" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-white p-5 rounded-xl border border-slate-100 shadow-sm"><p class="text-xs font-medium text-slate-500 uppercase">전체 혈액 팩 수</p><p class="text-2xl font-bold text-slate-900 mt-1" id="total-units">0 팩</p></div>
        <div class="bg-white p-5 rounded-xl border border-slate-100 shadow-sm"><p class="text-xs font-medium text-slate-500 uppercase">사용 가능</p><p class="text-2xl font-bold text-emerald-600 mt-1" id="available-units">0 팩</p></div>
        <div class="bg-white p-5 rounded-xl border border-slate-100 shadow-sm"><p class="text-xs font-medium text-amber-600 uppercase">유효기간 임박</p><p class="text-2xl font-bold text-amber-600 mt-1" id="expiring-soon">0 팩</p></div>
        <div class="bg-white p-5 rounded-xl border border-slate-100 shadow-sm"><p class="text-xs font-medium text-rose-600 uppercase">폐기/보류</p><p class="text-2xl font-bold text-rose-600 mt-1" id="disposed-units">0 팩</p></div>
    </div>

    <div class="bg-white rounded-xl border border-slate-100 shadow-sm overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center"><h2 class="font-bold text-slate-800">blood_units 데이터 목록</h2><button onclick="fetchBloodUnitsData()" class="px-3 py-1.5 text-xs bg-indigo-50 text-indigo-600 font-medium rounded-lg hover:bg-indigo-100">새로고침</button></div>
        <div class="overflow-x-auto"><table class="w-full text-left text-sm text-slate-600"><thead class="bg-slate-50 text-xs font-semibold text-slate-500 uppercase tracking-wider"><tr><th class="px-6 py-3">Unit ID</th><th class="px-6 py-3">혈액형</th><th class="px-6 py-3">종류</th><th class="px-6 py-3">채혈일</th><th class="px-6 py-3">유효기간</th><th class="px-6 py-3">상태</th></tr></thead><tbody id="blood-units-tbody"><tr><td colspan="6" class="px-6 py-8 text-center text-slate-400">데이터를 불러오는 중입니다...</td></tr></tbody></table></div>
    </div>
</div>
<script>
const API_URL='/medical/api/blood_units';
const MOCK_BLOOD_UNITS=[
{unit_id:'BU-2026-0801',blood_type:'A+',component_type:'적혈구제제 (RBC)',donation_date:'2026-08-10',expiration_date:'2026-08-28',status:'Available'},
{unit_id:'BU-2026-0802',blood_type:'O+',component_type:'전혈 (Whole)',donation_date:'2026-08-12',expiration_date:'2026-08-26',status:'Available'},
{unit_id:'BU-2026-0803',blood_type:'B-',component_type:'혈소판 (PLT)',donation_date:'2026-08-22',expiration_date:'2026-08-27',status:'Reserved'},
{unit_id:'BU-2026-0804',blood_type:'AB+',component_type:'신선동결혈장 (FFP)',donation_date:'2026-07-15',expiration_date:'2026-08-15',status:'Disposed'},
{unit_id:'BU-2026-0805',blood_type:'O-',component_type:'적혈구제제 (RBC)',donation_date:'2026-08-18',expiration_date:'2026-09-01',status:'Available'}];
async function fetchBloodUnitsData(){const alertBox=document.getElementById('data-source-alert');let data=[];try{const r=await fetch(API_URL);if(!r.ok)throw new Error('API 응답 실패');data=await r.json();alertBox.className='mb-6 p-4 rounded-xl text-sm font-medium bg-emerald-50 text-emerald-700 border border-emerald-200';alertBox.innerText='연동 성공: 백엔드 API에서 실시간 DB 데이터를 불러왔습니다.';}catch(e){data=MOCK_BLOOD_UNITS;alertBox.className='mb-6 p-4 rounded-xl text-sm font-medium bg-amber-50 text-amber-700 border border-amber-200';alertBox.innerText='안내: 백엔드 API 미연결 상태입니다. 화면 확인을 위해 임시 샘플 데이터를 표시합니다.';}alertBox.classList.remove('hidden');renderTable(data);updateSummary(data);document.getElementById('last-updated').innerText=`최신화: ${new Date().toLocaleTimeString('ko-KR')}`;}
function renderTable(units){const tbody=document.getElementById('blood-units-tbody');tbody.innerHTML='';if(!units.length){tbody.innerHTML='<tr><td colspan="6" class="px-6 py-4 text-center text-slate-400">등록된 혈액 데이터가 없습니다.</td></tr>';return;}units.forEach(u=>{const row=document.createElement('tr');row.className='hover:bg-slate-50';const status=u.status==='Available'?'<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">사용 가능</span>':u.status==='Reserved'?'<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800">예약됨</span>':'<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-100 text-rose-800">폐기/보류</span>';row.innerHTML=`<td class="px-6 py-4 font-mono font-medium text-slate-900">${u.unit_id}</td><td class="px-6 py-4 font-bold text-indigo-600">${u.blood_type}</td><td class="px-6 py-4">${u.component_type||'-'}</td><td class="px-6 py-4 text-slate-500">${u.donation_date}</td><td class="px-6 py-4 text-slate-500">${u.expiration_date}</td><td class="px-6 py-4">${status}</td>`;tbody.appendChild(row);});}
function updateSummary(units){document.getElementById('total-units').innerText=`${units.length} 팩`;document.getElementById('available-units').innerText=`${units.filter(u=>u.status==='Available').length} 팩`;document.getElementById('disposed-units').innerText=`${units.filter(u=>u.status==='Disposed'||u.status==='Hold').length} 팩`;const now=new Date();const limit=new Date(now.getTime()+7*24*60*60*1000);document.getElementById('expiring-soon').innerText=`${units.filter(u=>u.status==='Available'&&new Date(u.expiration_date)>=now&&new Date(u.expiration_date)<=limit).length} 팩`;}
document.addEventListener('DOMContentLoaded',fetchBloodUnitsData);
</script>
</body>
</html>
