# React frontend URL
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

spring.application.name=shop

server.port=80
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql=trace
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

spring.servlet.multipart.maxFileSize=20MB
spring.servlet.multipart.maxRequestSize=100MB
itemImgLocation=/home/ec2-user/shop1/item
uploadPath=file:///home/ec2-user/shop1/

spring.profiles.include=oauth

backend.api.url=http://localhost:80/api/admin/stock/sync

# 대한적십자사 공식 혈액보유현황 크롤러
crawler.use-dummy=false
crawler.timeout-ms=10000
crawler.schedule.cron=0 5 0 * * *

# 공식 보유량 기반 blood_units 더미 생성: 하루 1회
crawler.dummy-generation.enabled=true
crawler.dummy-generation.cron=0 10 0 * * *
