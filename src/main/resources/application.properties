# ============================================
# React Frontend
# ============================================
app.frontend-url=${FRONTEND_URL:http://localhost:5173}


# ============================================
# Spring Boot
# ============================================
spring.application.name=shop
server.port=80


# ============================================
# Database - MariaDB
# ============================================
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect


# ============================================
# Hibernate SQL Logging
# ============================================

# ?? INSERT SQL ?? ?? ??
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false

# Hibernate SQL ?? ????
logging.level.org.hibernate.SQL=OFF

# SQL ???? ??? ?? ????
logging.level.org.hibernate.orm.jdbc.bind=OFF

# ??? Hibernate SQL parameter ?? ????
logging.level.org.hibernate.type.descriptor.sql=OFF


# ============================================
# File Upload
# ============================================
spring.servlet.multipart.maxFileSize=20MB
spring.servlet.multipart.maxRequestSize=100MB

itemImgLocation=/home/ec2-user/shop1/item
uploadPath=file:///home/ec2-user/shop1/


# ============================================
# Profile
# ============================================
spring.profiles.include=oauth


# ============================================
# Backend API
# ============================================
backend.api.url=http://localhost:80/api/admin/stock/sync


# ============================================
# ?????? ???
# ============================================

# false = ?? ???? ??
# true  = ?? ??? ??? ??
crawler.use-dummy=false

# HTTP ?? ????
# 30000ms = 30?
crawler.timeout-ms=30000

# ??? ?? ? ??? ??
crawler.retry-count=3

# ??? ? ????
# 2000ms = 2?
crawler.retry-delay-ms=2000

# ?? 00:05 ?????? ???
crawler.schedule.cron=0 5 0 * * *


# ============================================
# ?? ????? blood_units ?? ??
# ============================================

# ????? ?? ?? ??
crawler.dummy-generation.enabled=true

# ?? 00:10 ?? ??
crawler.dummy-generation.cron=0 10 0 * * *
# 주민등록번호 식별 해시용 비밀값(운영환경에서는 반드시 환경변수로 설정)
app.identity-hash-pepper=${IDENTITY_HASH_PEPPER:local-development-only}

# ============================================
# NAVER Maps
