# ============================================
# React Frontend
# ============================================
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# 카카오 Developers "나에게 보내기" 데모 기능입니다.
# 카카오 로그인 문제를 해결하고 실제 수신 테스트를 시작할 때 true로 변경합니다.
kakao.message.enabled=${KAKAO_MESSAGE_ENABLED:false}


# ============================================
# Spring Boot
# ============================================
spring.application.name=shop
server.port=80


# ============================================
# Database - MariaDB
# ============================================
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect


# ============================================
# Hibernate SQL Logging
# ============================================

# ?? INSERT SQL ?? ?? ??
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false

# Hibernate SQL ?? ????
logging.level.org.hibernate.SQL=OFF

# SQL ???? ??? ?? ????
logging.level.org.hibernate.orm.jdbc.bind=OFF

# ??? Hibernate SQL parameter ?? ????
logging.level.org.hibernate.type.descriptor.sql=OFF


# ============================================
# File Upload
# ============================================
spring.servlet.multipart.maxFileSize=20MB
spring.servlet.multipart.maxRequestSize=100MB

itemImgLocation=/home/ec2-user/shop1/item
uploadPath=file:///home/ec2-user/shop1/


# ============================================
# Profile
# ============================================
spring.profiles.include=oauth


# ============================================
# Backend API
# ============================================
backend.api.url=http://localhost:80/api/admin/stock/sync


